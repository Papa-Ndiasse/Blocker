name: Build & Publish Auto-Update APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emergency_disable:
        description: "SECOURS URGENCE : publier une MAJ qui désactive proprement Blocker (false en temps normal)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses and ensure API 35
        run: |
          SDKMGR=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode persistent release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 manquant !"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GITHUB_UPDATE_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
          EMERGENCY_DISABLE: ${{ github.event.inputs.emergency_disable || 'false' }}
        run: ./gradlew assembleRelease

      - name: Prepare release assets and SHA-256 manifest
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          EMERGENCY_DISABLE: ${{ github.event.inputs.emergency_disable || 'false' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk blocker-release.apk
          SHA256=$(sha256sum blocker-release.apk | awk '{print $1}')
          cat <<EOF > update.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkName": "blocker-release.apk",
            "sha256": "${SHA256}",
            "emergencyDisable": ${EMERGENCY_DISABLE}
          }
          EOF
          cat update.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
          EMERGENCY_DISABLE: ${{ github.event.inputs.emergency_disable || 'false' }}
        run: |
          TITLE="Blocker $TAG"
          NOTES="Mise à jour automatique générée depuis main (commit ${GITHUB_SHA::7})."
          if [ "$EMERGENCY_DISABLE" = "true" ]; then
            TITLE="Blocker $TAG [URGENCE - DÉSACTIVATION]"
            NOTES="Version de secours publiée volontairement pour désactiver proprement Blocker sur le téléphone."
          fi
          gh release create "$TAG" \
            blocker-release.apk \
            update.json \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
